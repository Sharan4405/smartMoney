<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title">
  <title id="title">Home loan illustration</title>
  <rect width="400" height="300" rx="16" fill="#F6F8FB"/>
  <circle cx="215" cy="170" r="110" fill="#0B1B33" opacity="0.05"/>

  <!-- loan document -->
  <rect x="150" y="68" width="172" height="192" rx="12" fill="#FFFFFF" stroke="#0B1B33" stroke-width="4"/>
  <text x="236" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1B33">HOME LOAN</text>
  <line x1="166" y1="112" x2="306" y2="112" stroke="#E4E8EF" stroke-width="2"/>

  <line x1="166" y1="132" x2="298" y2="132" stroke="#5B6472" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="166" y1="152" x2="298" y2="152" stroke="#5B6472" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="166" y1="172" x2="270" y2="172" stroke="#5B6472" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="166" y1="192" x2="298" y2="192" stroke="#5B6472" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="166" y1="212" x2="250" y2="212" stroke="#5B6472" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- house stamp -->
  <circle cx="286" cy="232" r="24" fill="#D9A441" opacity="0.14" stroke="#D9A441" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M271 231 L286 217 L301 231" fill="none" stroke="#0B1B33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="277" y="231" width="18" height="15" fill="#0B1B33"/>
  <rect x="283" y="238" width="6" height="8" fill="#D9A441"/>

  <!-- money bag, matching the Personal Loans icon, scaled down -->
  <g transform="translate(-4,141.7) scale(0.58)">
    <path d="M130 178
             C130 150 148 126 172 118
             L182 104 L192 116 L200 102 L208 116 L218 104 L228 118
             C252 126 270 150 270 178
             C270 206 246 230 200 230
             C154 230 130 206 130 178 Z" fill="#D9A441"/>
    <path d="M152 152 C148 174 154 200 176 216 C160 206 142 182 148 152 Z" fill="#E8B84B" opacity="0.6"/>
    <path d="M188 108 L216 150" fill="none" stroke="#1F4D3A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M212 108 L184 150" fill="none" stroke="#1F4D3A" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="200" cy="104" rx="9" ry="6" fill="#1F4D3A"/>
    <text x="200" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0B1B33">&#8377;</text>
  </g>
