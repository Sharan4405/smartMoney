<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="30" y1="20" x2="180" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7dd8f"/>
      <stop offset="0.45" stop-color="#e8b84b"/>
      <stop offset="0.75" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#b8862c"/>
    </linearGradient>
    <linearGradient id="goldArrow" x1="40" y1="160" x2="170" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cf982f"/>
      <stop offset="0.5" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#e8b84b"/>
    </linearGradient>
    <linearGradient id="green" x1="55" y1="45" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e6b4f"/>
      <stop offset="0.55" stop-color="#1f4d3a"/>
      <stop offset="1" stop-color="#0f2c20"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#cf982f"/>
    </linearGradient>
  </defs>

  <!-- growth arrow sweeping up-right, behind the monogram -->
  <g>
    <path d="M40 150 C 40 96, 84 72, 128 92"
          fill="none" stroke="url(#goldArrow)" stroke-width="15"
          stroke-linecap="round"/>
    <path d="M112 74 L 156 66 L 140 108 Z" fill="url(#goldArrow)"/>
  </g>

  <!-- ascending mutual-fund bars, lower-right -->
  <g fill="url(#barGrad)">
    <rect x="120" y="140" width="10" height="24" rx="2"/>
    <rect x="134" y="128" width="10" height="36" rx="2"/>
    <rect x="148" y="114" width="10" height="50" rx="2"/>
    <rect x="162" y="98"  width="10" height="66" rx="2"/>
  </g>

  <!-- SM monogram -->
  <text x="44" y="150" font-family="Georgia, 'Times New Roman', serif"
        font-size="150" font-weight="700" fill="url(#green)"
        stroke="url(#gold)" stroke-width="2.5">S</text>
  <text x="96" y="145" font-family="Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="700" fill="url(#gold)">M</text>
</svg>
